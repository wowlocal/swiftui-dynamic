<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lane-foodtruck — loop health</title>
<style>
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --axis:      #c3c2b7;
    --ring:      rgba(11,11,11,0.10);
    --series-1:  #2a78d6;
    --series-2:  #eb6834;
    --good:      #0ca30c;
    --warning:   #fab219;
    --critical:  #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --axis: #383835;
      --ring: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --ring: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 24px 56px;
    background: var(--page); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-size: 19px; font-weight: 640; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px 4px 9px; border-radius: 999px;
    border: 1px solid var(--ring); font-size: 12.5px; font-weight: 560;
    color: var(--ink-2); background: var(--surface);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.good { background: var(--good); }
  .dot.warn { background: var(--warning); }
  .dot.crit { background: var(--critical); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 13px 15px 14px; }
  .tile .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
  .tile .value { font-size: 27px; font-weight: 620; margin-top: 5px; letter-spacing: -0.02em; line-height: 1.1; }
  .tile .note { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .tile .value .unit { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 15px 16px 12px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { font-size: 13.5px; font-weight: 620; margin: 0 0 2px; }
  .card .hint { font-size: 12px; color: var(--muted); margin-bottom: 9px; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-head .spacer { flex: 1; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  button.link {
    background: none; border: none; padding: 2px 4px; cursor: pointer;
    font: inherit; font-size: 12px; color: var(--muted); text-decoration: underline;
    text-underline-offset: 2px;
  }
  button.link:hover { color: var(--ink); }

  svg { display: block; width: 100%; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axisline { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .rule { stroke: var(--muted); stroke-width: 1; stroke-dasharray: none; opacity: 0.55; }
  .rule-label { fill: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .endlabel { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

  table.tv { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  table.tv th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--grid); }
  table.tv td { padding: 3px 8px 3px 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
  .tv-wrap { max-height: 210px; overflow: auto; }

  .tip {
    position: fixed; pointer-events: none; z-index: 9;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--ring); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 6px 22px rgba(0,0,0,0.13); opacity: 0; transition: opacity .09s;
    font-variant-numeric: tabular-nums; max-width: 260px;
  }
  .tip b { font-weight: 620; }
  .tip .k { color: var(--muted); }

  #stage { transition: opacity .15s; }
  #stage.stale { opacity: 0.55; }

  .events { font-size: 12.5px; }
  .events div { display: flex; gap: 9px; padding: 3px 0; border-bottom: 1px solid var(--grid); }
  .events .when { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .events .kind { font-weight: 600; flex: none; }

  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>lane-foodtruck</h1>
    <span class="sub" id="head-sub">loop health</span>
    <span class="spacer"></span>
    <button class="link" id="theme" style="margin-right:2px">theme</button>
    <span class="pill" id="live"><span class="dot" id="live-dot"></span><span id="live-text">connecting…</span></span>
  </header>
  <div id="stage">
    <div class="tiles" id="tiles"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
const tip = document.getElementById("tip");
const fmtInt = n => (n === null || n === undefined) ? "—" : n.toLocaleString("en-US");
const pad = n => String(n).padStart(2, "0");

function fmtDur(sec) {
  if (sec === null || sec === undefined) return "—";
  if (sec < 90) return sec + "s";
  const m = Math.round(sec / 60);
  if (m < 90) return m + "m";
  return (sec / 3600).toFixed(1) + "h";
}
function fmtClock(ts) {
  const d = new Date(ts * 1000);
  return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function fmtDay(ts) {
  const d = new Date(ts * 1000);
  return pad(d.getDate()) + "." + pad(d.getMonth() + 1);
}
function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return s + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  return (s / 3600).toFixed(1) + "h ago";
}

function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = evt.clientY - h - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };

// ── chart kit ────────────────────────────────────────────────────────────────
// Hand-rolled SVG: thin marks, hairline recessive grid, one y-axis per chart,
// crosshair or per-mark hover, and a table view behind every chart so no value
// is reachable only by pointing at it.

const W = 640, H = 190, M = { t: 12, r: 46, b: 26, l: 50 };

function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function niceTicks(min, max, count) {
  if (max === min) { max = min + 1; }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(v);
  return out;
}

function frame(svg, yTicks, yScale, xLabels, fmtY) {
  for (const t of yTicks) {
    const y = yScale(t);
    svg.appendChild(svgEl("line", { x1: M.l, x2: W - M.r, y1: y, y2: y, class: "gridline" }));
    const label = svgEl("text", { x: M.l - 8, y: y + 3.5, class: "tick", "text-anchor": "end" });
    label.textContent = fmtY ? fmtY(t) : fmtInt(t);
    svg.appendChild(label);
  }
  svg.appendChild(svgEl("line", { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b, class: "axisline" }));
  for (const { x, text } of xLabels) {
    const label = svgEl("text", { x, y: H - M.b + 15, class: "tick", "text-anchor": "middle" });
    label.textContent = text;
    svg.appendChild(label);
  }
}

/** Line over time. One series only — two measures never share an axis.
 *  `zeroBased` is false for ratios: forcing 0 into the domain of a series that
 *  lives at 7.44 against a floor of 6.5 squashes the line and its rule into the
 *  same two pixels, which is the one thing the chart exists to separate. */
function lineChart(host, { points, fmtY, fmtValue, rules = [], color = "var(--series-1)", zeroBased = true }) {
  host.innerHTML = "";
  if (!points.length) { host.textContent = "no data yet"; return; }
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const xs = points.map(p => p.x);
  const ys = points.map(p => p.y);
  const ruleVals = rules.map(r => r.value);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const lo = Math.min(...ys, ...ruleVals), hi = Math.max(...ys, ...ruleVals);
  const padY = (hi - lo) * 0.25 || Math.abs(hi) * 0.05 || 1;
  const minY = zeroBased ? Math.min(0, lo) : lo - padY;
  const maxY = zeroBased ? hi * 1.06 : hi + padY;
  const X = v => M.l + (maxX === minX ? 0.5 : (v - minX) / (maxX - minX)) * (W - M.l - M.r);
  const ticks = niceTicks(minY, maxY, 4);
  // Headroom so the extreme point is not drawn on the frame's own edge.
  const top = Math.max(maxY, ticks[ticks.length - 1]);
  const bottom = Math.min(minY, ticks[0]);
  const Y = v => H - M.b - (top === bottom ? 0 : (v - bottom) / (top - bottom)) * (H - M.t - M.b);

  // A series spanning less than three days repeats the same day label five
  // times; fall back to hours so the axis says something.
  const spanDays = (maxX - minX) / 86400;
  const fmtX = spanDays < 3 ? (t => fmtClock(t).slice(6)) : fmtDay;
  const xLabels = [];
  const step = Math.max(1, Math.floor(points.length / 5));
  for (let i = 0; i < points.length; i += step) xLabels.push({ x: X(points[i].x), text: fmtX(points[i].x) });
  frame(svg, ticks, Y, xLabels, fmtY);

  for (const r of rules) {
    const y = Y(r.value);
    svg.appendChild(svgEl("line", { x1: M.l, x2: W - M.r, y1: y, y2: y, class: "rule" }));
    const label = svgEl("text", { x: W - M.r + 5, y: y + 3.5, class: "rule-label" });
    label.textContent = r.label;
    svg.appendChild(label);
  }

  const d = points.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  svg.appendChild(svgEl("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));

  const last = points[points.length - 1];
  svg.appendChild(svgEl("circle", { cx: X(last.x), cy: Y(last.y), r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
  const endLabel = svgEl("text", { x: X(last.x) + 8, y: Y(last.y) + 4, class: "endlabel" });
  endLabel.textContent = fmtValue ? fmtValue(last.y) : fmtInt(last.y);
  svg.appendChild(endLabel);

  const cross = svgEl("line", { y1: M.t, y2: H - M.b, class: "axisline", opacity: 0 });
  const knob = svgEl("circle", { r: 4.5, fill: color, stroke: "var(--surface)", "stroke-width": 2, opacity: 0 });
  svg.appendChild(cross); svg.appendChild(knob);
  const hit = svgEl("rect", { x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b, fill: "transparent" });
  svg.appendChild(hit);
  hit.addEventListener("pointermove", evt => {
    const box = svg.getBoundingClientRect();
    const px = (evt.clientX - box.left) / box.width * W;
    let best = points[0], bestD = Infinity;
    for (const p of points) { const dd = Math.abs(X(p.x) - px); if (dd < bestD) { bestD = dd; best = p; } }
    cross.setAttribute("x1", X(best.x)); cross.setAttribute("x2", X(best.x)); cross.setAttribute("opacity", 0.4);
    knob.setAttribute("cx", X(best.x)); knob.setAttribute("cy", Y(best.y)); knob.setAttribute("opacity", 1);
    showTip(evt, `<b>${fmtValue ? fmtValue(best.y) : fmtInt(best.y)}</b><br><span class="k">${fmtClock(best.x)}${best.note ? " · " + best.note : ""}</span>`);
  });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); knob.setAttribute("opacity", 0); hideTip(); });
  host.appendChild(svg);
}

/** Vertical bars. `series` picks the categorical slot; a legend is drawn by the caller. */
function barChart(host, { bars, fmtY, fmtValue, colors }) {
  host.innerHTML = "";
  if (!bars.length) { host.textContent = "no data yet"; return; }
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  const maxY = Math.max(...bars.map(b => b.value));
  const ticks = niceTicks(0, maxY, 4);
  const top = Math.max(maxY, ticks[ticks.length - 1]);
  const Y = v => H - M.b - (top ? v / top : 0) * (H - M.t - M.b);
  const plot = W - M.l - M.r;
  const slot = plot / bars.length;
  const bw = Math.max(2, Math.min(26, slot - 2));   // 2px surface gap between bars

  const xLabels = [];
  const step = Math.max(1, Math.floor(bars.length / 5));
  for (let i = 0; i < bars.length; i += step) xLabels.push({ x: M.l + slot * (i + 0.5), text: bars[i].label });
  frame(svg, ticks, Y, xLabels, fmtY);

  bars.forEach((b, i) => {
    const x = M.l + slot * i + (slot - bw) / 2;
    const y = Y(b.value);
    const h = Math.max(1, H - M.b - y);
    const fill = colors[b.series] || colors.default;
    svg.appendChild(svgEl("rect", { x, y, width: bw, height: h, rx: Math.min(4, bw / 2), fill }));
    const hit = svgEl("rect", { x: M.l + slot * i, y: M.t, width: slot, height: H - M.t - M.b, fill: "transparent" });
    hit.addEventListener("pointermove", evt =>
      showTip(evt, `<b>${fmtValue ? fmtValue(b.value) : fmtInt(b.value)}</b><br><span class="k">${b.tip || b.label}</span>`));
    hit.addEventListener("pointerleave", hideTip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
}

/** Horizontal bars for a small labelled set — one colour, never a value-ramp. */
function hbarChart(host, { rows, fmtValue }) {
  host.innerHTML = "";
  if (!rows.length) { host.textContent = "no data yet"; return; }
  const rowH = 22, labelW = 120;
  const h = rows.length * rowH + 8;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${h}`, preserveAspectRatio: "none" });
  const maxV = Math.max(1, ...rows.map(r => r.value));
  rows.forEach((r, i) => {
    const y = i * rowH + 4;
    const label = svgEl("text", { x: labelW - 8, y: y + 12, class: "tick", "text-anchor": "end" });
    label.textContent = r.label;
    svg.appendChild(label);
    const full = W - labelW - 60;
    const bw = Math.max(r.value > 0 ? 3 : 0, (r.value / maxV) * full);
    if (bw > 0) svg.appendChild(svgEl("rect", { x: labelW, y: y + 3, width: bw, height: 11, rx: 4, fill: "var(--series-1)" }));
    const value = svgEl("text", { x: labelW + bw + 7, y: y + 12.5, class: "endlabel" });
    value.textContent = fmtValue ? fmtValue(r.value) : fmtInt(r.value);
    svg.appendChild(value);
    const hit = svgEl("rect", { x: 0, y, width: W, height: rowH, fill: "transparent" });
    hit.addEventListener("pointermove", evt => showTip(evt, `<b>${r.label}</b><br><span class="k">${fmtValue ? fmtValue(r.value) : fmtInt(r.value)} AE</span>`));
    hit.addEventListener("pointerleave", hideTip);
    svg.appendChild(hit);
  });
  host.appendChild(svg);
}

// ── cards ────────────────────────────────────────────────────────────────────

function card(id, title, hint, { wide = false, legend = null } = {}) {
  const el = document.createElement("div");
  el.className = "card" + (wide ? " wide" : "");
  el.innerHTML = `
    <div class="card-head">
      <div style="min-width:0">
        <h2>${title}</h2>
        <div class="hint">${hint}</div>
      </div>
      <span class="spacer"></span>
      <button class="link" data-toggle="${id}">table</button>
    </div>
    ${legend || ""}
    <div id="${id}"></div>
    <div id="${id}-table" hidden></div>`;
  return el;
}

function tableView(host, columns, rows) {
  host.innerHTML = `<div class="tv-wrap"><table class="tv"><thead><tr>${
    columns.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

let built = false;
function build() {
  const grid = document.getElementById("grid");
  grid.appendChild(card("debt", "Open pixel debt", "Sum of committed R2 floors across every scored screen. Spikes are the board widening — new screens open honest debt.", { wide: true }));
  grid.appendChild(card("screens", "Debt by screen, now", "Committed floor per screen. A screen at 0 is pixel-identical to the native twin."));
  grid.appendChild(card("iters", "Iteration length", "Short iterations produced nothing — they spun observing a gate an earlier iteration still holds.", {
    legend: `<div class="legend"><span><i class="swatch" style="background:var(--series-1)"></i>productive</span><span><i class="swatch" style="background:var(--series-2)"></i>spun on a gate</span></div>`
  }));
  grid.appendChild(card("landings", "Commits landed per day", "Batches merged into origin/main, fast-forward only."));
  grid.appendChild(card("leverage", "Generation leverage", "Generated lines per line of generator. The floor is the anti-drift ratchet in the closing gate."));
  grid.appendChild(card("identity", "Identity-branch density", "Identity-keyed branches per 1000 generated lines. Rises only when hand-written cases outrun coverage."));
  grid.appendChild(card("events", "Recent ledger events", "MERGE-READY / MERGE-DONE / STALL from .claude/claims.md."));
  grid.addEventListener("click", evt => {
    const id = evt.target.dataset && evt.target.dataset.toggle;
    if (!id) return;
    const chart = document.getElementById(id), table = document.getElementById(id + "-table");
    const showTable = table.hasAttribute("hidden");
    table.toggleAttribute("hidden", !showTable);
    chart.toggleAttribute("hidden", showTable);
    evt.target.textContent = showTable ? "chart" : "table";
  });
  built = true;
}

function tile(label, value, unit, note, statusClass) {
  return `<div class="tile">
    <div class="label">${label}</div>
    <div class="value">${value}${unit ? `<span class="unit">${unit}</span>` : ""}</div>
    <div class="note">${statusClass ? `<span class="dot ${statusClass}" style="display:inline-block;margin-right:5px"></span>` : ""}${note || ""}</div>
  </div>`;
}

function render(d) {
  if (!built) build();

  // ── status pill + tiles ────────────────────────────────────────────────────
  const alive = d.loop.alive;
  const paused = d.loop.stopFlagSet;
  document.getElementById("live-dot").className = "dot " + (alive && !paused ? "good" : paused ? "warn" : "crit");
  document.getElementById("live-text").textContent = alive
    ? (paused ? "pausing at the iteration boundary" : "running") : "stopped";
  document.getElementById("head-sub").textContent =
    `origin/main ${d.head.originMain} · updated ${fmtClock(d.generatedAt)} · collected in ${d.collectSeconds}s`;

  const board = d.board || {};
  const screens = Object.keys(board);
  const debt = screens.reduce((s, k) => s + board[k], 0);
  const open = screens.filter(k => board[k] > 0).length;
  const day = 86400, now = Math.floor(Date.now() / 1000);
  const landed24 = d.landings.filter(l => l.ts > now - day).length;
  const lastLanding = d.landings.length ? d.landings[d.landings.length - 1] : null;
  const iters = d.iterations.filter(i => !i.running);
  const recent = iters.slice(-24);
  const spun = recent.filter(i => i.kind === "spin").length;
  const last = d.antiDrift.length ? d.antiDrift[d.antiDrift.length - 1] : null;
  const disk = d.disk;

  document.getElementById("tiles").innerHTML = [
    tile("Loop", alive ? "live" : "stopped",
      "", alive ? `iteration running ${fmtDur(d.loop.iterationSeconds)}` : "runner not present",
      alive && !paused ? "good" : paused ? "warn" : "crit"),
    tile("Open pixel debt", fmtInt(debt), "AE",
      `${open} of ${screens.length} screens carry debt`, debt === 0 ? "good" : null),
    tile("Landed", landed24, "/24h",
      lastLanding ? `last ${ago(lastLanding.ts)}` : "—",
      lastLanding && lastLanding.ts > now - 4 * 3600 ? "good" : "warn"),
    tile("Spun iterations", spun, `/${recent.length}`,
      "waiting on someone else's gate", spun > recent.length / 3 ? "warn" : "good"),
    tile("Leverage", last ? last.leverage.toFixed(2) : "—", "",
      `floor ${d.thresholds.leverageFloor ?? "—"}`,
      last && d.thresholds.leverageFloor && last.leverage < d.thresholds.leverageFloor ? "crit" : "good"),
    tile("Disk free", fmtInt(disk.freeGiB), "GiB",
      `${disk.scratchDirs} gate checkouts, ${disk.scratchGiB} GiB`,
      disk.freeGiB > 40 ? "good" : disk.freeGiB > 15 ? "warn" : "crit"),
  ].join("");

  // ── open debt over time ────────────────────────────────────────────────────
  const debtPoints = d.boardHistory.map(b => ({ x: b.ts, y: b.total, note: `${b.count} screens · ${b.sha}` }));
  lineChart(document.getElementById("debt"), { points: debtPoints, fmtValue: v => fmtInt(v) + " AE" });
  tableView(document.getElementById("debt-table"), ["when", "sha", "screens", "total AE"],
    d.boardHistory.slice().reverse().map(b => [fmtClock(b.ts), b.sha, b.count, fmtInt(b.total)]));

  // ── per-screen debt ────────────────────────────────────────────────────────
  const rows = screens.map(k => ({ label: k, value: board[k] })).sort((a, b) => b.value - a.value);
  hbarChart(document.getElementById("screens"), { rows });
  tableView(document.getElementById("screens-table"), ["screen", "AE"], rows.map(r => [r.label, fmtInt(r.value)]));

  // ── iteration length ───────────────────────────────────────────────────────
  const iterBars = recent.map(i => ({
    label: fmtClock(i.startedAt).slice(6), value: i.seconds, series: i.kind,
    tip: `${fmtClock(i.startedAt)} · ${i.kind === "spin" ? "spun on a gate" : "productive"}`,
  }));
  // One unit for the whole axis — "1.7h" sitting above "67m" makes the reader
  // convert in their head to compare two ticks of the same scale.
  const iterMax = Math.max(0, ...iterBars.map(b => b.value));
  const iterAxis = iterMax >= 3 * 3600 ? (v => (v / 3600).toFixed(1) + "h") : (v => Math.round(v / 60) + "m");
  barChart(document.getElementById("iters"), {
    bars: iterBars, fmtY: iterAxis, fmtValue: v => fmtDur(v),
    colors: { work: "var(--series-1)", spin: "var(--series-2)", default: "var(--series-1)" },
  });
  tableView(document.getElementById("iters-table"), ["started", "length", "kind", "exit"],
    recent.slice().reverse().map(i => [fmtClock(i.startedAt), fmtDur(i.seconds), i.kind, i.exit ?? "—"]));

  // ── landings per day ───────────────────────────────────────────────────────
  const byDay = new Map();
  for (const l of d.landings) {
    const key = fmtDay(l.ts);
    byDay.set(key, (byDay.get(key) || 0) + 1);
  }
  const dayBars = [...byDay.entries()].slice(-14).map(([label, value]) => ({ label, value, series: "work", tip: label }));
  barChart(document.getElementById("landings"), {
    bars: dayBars, colors: { work: "var(--series-1)", default: "var(--series-1)" },
  });
  tableView(document.getElementById("landings-table"), ["day", "commits"], [...byDay.entries()].reverse().map(([k, v]) => [k, v]));

  // ── ratchets ───────────────────────────────────────────────────────────────
  lineChart(document.getElementById("leverage"), {
    points: d.antiDrift.map(a => ({ x: a.ts, y: a.leverage, note: a.sha })),
    fmtY: v => v.toFixed(2), fmtValue: v => v.toFixed(3), zeroBased: false,
    rules: d.thresholds.leverageFloor ? [{ value: d.thresholds.leverageFloor, label: "floor" }] : [],
  });
  tableView(document.getElementById("leverage-table"), ["when", "sha", "leverage", "generated", "generator"],
    d.antiDrift.slice().reverse().map(a => [fmtClock(a.ts), a.sha, a.leverage.toFixed(4), fmtInt(a.generated), fmtInt(a.generator)]));

  lineChart(document.getElementById("identity"), {
    points: d.antiDrift.map(a => ({ x: a.ts, y: a.identityDensity, note: a.sha })),
    fmtY: v => v.toFixed(2), fmtValue: v => v.toFixed(2), zeroBased: false,
    rules: d.thresholds.identityDensityCeiling ? [{ value: d.thresholds.identityDensityCeiling, label: "ceiling" }] : [],
  });
  tableView(document.getElementById("identity-table"), ["when", "sha", "density", "branches"],
    d.antiDrift.slice().reverse().map(a => [fmtClock(a.ts), a.sha, a.identityDensity.toFixed(3), fmtInt(a.identity)]));

  // ── ledger ─────────────────────────────────────────────────────────────────
  const events = d.claims.slice().reverse();
  document.getElementById("events").innerHTML = `<div class="events">${
    events.map(e => `<div><span class="when">${e.at.slice(5, 16).replace("T", " ")}</span><span class="kind">${e.kind}</span><span>${e.lane}</span></div>`).join("")
  }</div>`;
  tableView(document.getElementById("events-table"), ["at", "lane", "kind"], events.map(e => [e.at, e.lane, e.kind]));
}

// ── polling ──────────────────────────────────────────────────────────────────
const root = document.documentElement;
const saved = localStorage.getItem("dash-theme");
if (saved) root.setAttribute("data-theme", saved);
document.getElementById("theme").addEventListener("click", () => {
  const dark = getComputedStyle(root).getPropertyValue("--page").trim() === "#0d0d0d";
  const next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("dash-theme", next);
});

const stage = document.getElementById("stage");
async function poll() {
  stage.classList.add("stale");            // hold the previous render, never a skeleton
  try {
    const res = await fetch("/data.json", { cache: "no-store" });
    render(await res.json());
  } catch (err) {
    document.getElementById("live-dot").className = "dot crit";
    document.getElementById("live-text").textContent = "collector unreachable";
  } finally {
    stage.classList.remove("stale");
  }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
